name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        working-directory: app
        run: uv sync
      - name: Lint
        working-directory: app
        run: uv run ruff check src tests
      - name: Test
        working-directory: app
        run: uv run pytest -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'
      - name: Install libusb (picotool build dependency)
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - name: Clone pico-sdk
        run: |
          git clone --depth 1 --branch 2.3.0 https://github.com/raspberrypi/pico-sdk.git "$HOME/pico-sdk"
          cd "$HOME/pico-sdk"
          git submodule update --init --depth 1 lib/tinyusb
      - name: Build
        env:
          PICO_SDK_PATH: /home/runner/pico-sdk
        run: |
          cmake -S firmware -B firmware/build -DCMAKE_BUILD_TYPE=Release
          cmake --build firmware/build -j"$(nproc)"
