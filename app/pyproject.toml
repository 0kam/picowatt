[project]
name = "picowatt"
version = "0.1.0"
description = "PC application for the picowatt power measurement system (Pico 2 + INA228)"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "pyside6>=6.7",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "numpy>=1.26",
    "cobs>=1.2",
    "platformdirs>=4.0",
]

[project.scripts]
picowatt = "picowatt.mainwindow:main"
picowatt-cli = "picowatt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picowatt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
