<svg xmlns="http://www.w3.org/2000/svg" width="820" height="556" viewBox="0 0 820 556"><defs><marker id="arr_red" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L15,6 L0,12 z" fill="#c62828"/></marker><marker id="arr_blue" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L15,6 L0,12 z" fill="#1565c0"/></marker></defs><rect width="820" height="556" fill="#ffffff"/><text x="18" y="26" font-size="17" fill="#333333" text-anchor="start" font-weight="bold" font-family="sans-serif">VBUS は「INA228 の GND ピン」基準で測られる</text><text x="18" y="544" font-size="12" fill="#555" text-anchor="start" font-weight="normal" font-family="sans-serif">⌒ = 交差（接続しない）　GND リンクにはほぼ電流が流れないが、無いと測定の基準が消える</text><rect x="250" y="80" width="270" height="220" rx="10" fill="#faf8f1" stroke="#9aa3ad" stroke-width="1.8"/><text x="385" y="104" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" font-family="sans-serif">INA228 モジュール（ch0）</text><line x1="250" y1="130" x2="330" y2="130" stroke="#c62828" stroke-width="3"/><line x1="330" y1="130" x2="330" y2="150" stroke="#c62828" stroke-width="3"/><rect x="313" y="150" width="34" height="30" fill="#e8e8e8" stroke="#888"/><text x="330" y="169" font-size="9" fill="#444" text-anchor="middle" font-weight="normal" font-family="sans-serif">15mΩ</text><line x1="330" y1="180" x2="330" y2="200" stroke="#c62828" stroke-width="3"/><line x1="330" y1="200" x2="250" y2="200" stroke="#c62828" stroke-width="3"/><circle cx="250" cy="130" r="6" fill="#c62828"/><circle cx="250" cy="200" r="6" fill="#c62828"/><text x="242" y="121" font-size="12" fill="#333333" text-anchor="end" font-weight="bold" font-family="sans-serif">VIN+</text><text x="242" y="191" font-size="12" fill="#333333" text-anchor="end" font-weight="bold" font-family="sans-serif">VIN−</text><line x1="330" y1="130" x2="410" y2="130" stroke="#c62828" stroke-width="3" stroke-dasharray="6 4"/><text x="336" y="120" font-size="9" fill="#555" text-anchor="start" font-weight="normal" font-family="sans-serif">VBusジャンパ(閉)</text><path d="M 410,110 L 455,130 L 410,150 z" fill="#d7dde8" stroke="#555" stroke-width="1.5"/><text x="423" y="134" font-size="10" fill="#333" text-anchor="middle" font-weight="normal" font-family="sans-serif">A/D</text><text x="465" y="134" font-size="12" fill="#333333" text-anchor="start" font-weight="bold" font-family="sans-serif">= VBUS</text><line x1="410" y1="150" x2="410" y2="260" stroke="#1565c0" stroke-width="3"/><line x1="410" y1="260" x2="385" y2="260" stroke="#1565c0" stroke-width="3"/><line x1="385" y1="260" x2="385" y2="300" stroke="#1565c0" stroke-width="3"/><circle cx="385" cy="300" r="6" fill="#1565c0"/><text x="397" y="316" font-size="12" fill="#333333" text-anchor="start" font-weight="bold" font-family="sans-serif">GND ピン</text><text x="330" y="240" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" font-family="sans-serif">A/D は VBUS を</text><text x="330" y="256" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" font-family="sans-serif">自分の GND ピン基準で測る</text><rect x="230" y="400" width="330" height="30" rx="6" fill="#dde7d6" stroke="#5a6b5a"/><text x="395" y="420" font-size="11" fill="#333" text-anchor="middle" font-weight="normal" font-family="sans-serif">キャリア基板の GND ベタ（Pico の GND も同電位）</text><line x1="385" y1="306" x2="385" y2="400" stroke="#1565c0" stroke-width="3"/><rect x="560" y="388" width="62" height="50" rx="4" fill="#3a7d44"/><circle cx="580" cy="412" r="7" fill="#e8e8e8" stroke="#333333" stroke-width="1.4"/><line x1="576" y1="412" x2="584" y2="412" stroke="#333333" stroke-width="1.4"/><circle cx="602" cy="412" r="7" fill="#e8e8e8" stroke="#333333" stroke-width="1.4"/><line x1="598" y1="412" x2="606" y2="412" stroke="#333333" stroke-width="1.4"/><text x="591" y="456" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold" font-family="sans-serif">J5 (GND)</text><rect x="30" y="40" width="130" height="110" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="1.8"/><text x="95" y="78" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" font-family="sans-serif">安定化電源</text><circle cx="60" cy="150" r="7" fill="#1565c0"/><text x="60" y="138" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold" font-family="sans-serif">−</text><circle cx="130" cy="150" r="7" fill="#c62828"/><text x="130" y="138" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold" font-family="sans-serif">＋</text><rect x="660" y="40" width="130" height="110" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="1.8"/><text x="725" y="78" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" font-family="sans-serif">測定対象</text><circle cx="690" cy="150" r="7" fill="#c62828"/><text x="690" y="138" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold" font-family="sans-serif">＋</text><circle cx="760" cy="150" r="7" fill="#1565c0"/><text x="760" y="138" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold" font-family="sans-serif">−</text><path d="M 130,150 L 130,172 L 228,172 L 228,130 L 244,130" fill="none" stroke="#c62828" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 244,200 L 212,200 L 212,325 L 378,325 A 7 7 0 0 1 392,325 L 690,325 L 690,159" fill="none" stroke="#c62828" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr_red)"/><path d="M 760,150 L 760,345 L 392,345 A 7 7 0 0 0 378,345 L 60,345 L 60,159" fill="none" stroke="#1565c0" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr_blue)"/><circle cx="60" cy="345" r="5" fill="#1565c0"/><path d="M 60,345 L 60,470 L 580,470 L 580,430" fill="none" stroke="#1565c0" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr_blue)"/><rect x="138" y="485" width="384" height="16" rx="3" fill="#ffffff" fill-opacity="0.9"/><text x="330" y="495" font-size="11" fill="#1565c0" text-anchor="middle" font-weight="bold" font-family="sans-serif">GND リンク：電源の − → J5。これが無いと GND ピンの電位が決まらず、</text><rect x="176" y="502" width="307" height="16" rx="3" fill="#ffffff" fill-opacity="0.9"/><text x="330" y="512" font-size="11" fill="#1565c0" text-anchor="middle" font-weight="bold" font-family="sans-serif">浮いた基板が商用電源の 50/60 Hz を拾って VBUS が暴れる</text></svg>